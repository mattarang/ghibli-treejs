<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6e9e1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ghibli Foliage</title>
<link rel="stylesheet" href="/src/demo.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<link rel="stylesheet" href="/src/boot.css">
</head>
<body>
<div id="boot" role="status" aria-live="polite">
  <div class="boot-label">
    <div class="boot-dial" aria-hidden="true"><div class="boot-disc"><svg viewBox="-50 -50 100 100"><path fill="#e2728d" d="M0 0L-28.28 -28.28A40 40 0 0 1 28.28 -28.28Z"/><path fill="#2f6d50" d="M0 0L28.28 -28.28A40 40 0 0 1 28.28 28.28Z"/><path fill="#e9c35b" d="M0 0L28.28 28.28A40 40 0 0 1 -28.28 28.28Z"/><path fill="#5b6273" d="M0 0L-28.28 28.28A40 40 0 0 1 -28.28 -28.28Z"/></svg></div><svg class="boot-fixed" viewBox="-50 -50 100 100"><circle r="4.5" fill="#23271f"/><path d="M-1.6 -38 V-49 C-1.6 -56 7.5 -56 7.5 -49 V-46" fill="none" stroke="#23271f" stroke-width="2.6" stroke-linecap="round"/><path d="M-6 -42 L0 -33 L6 -42Z" fill="#23271f"/></svg></div>
    <div class="boot-text">
      <h1 class="boot-name">Ghibli Foliage</h1>
      <p class="boot-step">Loading</p>
      <p class="boot-pct">0%</p>
    </div>
  </div>
</div>
<span id="stats" hidden></span>

<!-- the tree: which kind, another of the same kind, and its shape -->
<div id="tree" class="hud">
  <button id="prev" class="chip-btn" type="button" aria-label="Previous tree">&#x2039;</button>
  <button id="name" class="chip-name" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="speciesSheet"><span id="nameText"></span><svg class="caret" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="next" class="chip-btn" type="button" aria-label="Next tree">&#x203A;</button>
  <button id="undo" class="chip-btn icon" type="button" aria-label="Undo" title="Undo (Ctrl+Z)" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 7H5V3M5.5 7.5A8 8 0 1 1 4 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="dice" class="chip-btn icon" type="button" aria-label="New tree of this kind" title="New tree of this kind"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="9" r="1.5" fill="currentColor"/><circle cx="15" cy="15" r="1.5" fill="currentColor"/><circle cx="15" cy="9" r="1.5" fill="currentColor"/><circle cx="9" cy="15" r="1.5" fill="currentColor"/></svg></button>
  <button id="shapeBtn" class="chip-btn shape-btn" type="button" aria-expanded="false" aria-controls="shape"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 8h10M18 8h2M4 16h2M10 16h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="16" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Shape</span></button>
</div>
<div id="speciesSheet" class="sheet" role="dialog" aria-label="Choose a tree" hidden>
  <p class="sheet-title">Choose a tree</p>
  <div id="speciesList" class="species-list"></div>
</div>
<div id="shape" class="pop" hidden role="region" aria-label="Tree shape">
  <div class="pop-head">
    <div><p class="pop-name">Shape</p><p class="pop-when" id="shapeStatus"></p></div>
    <button id="closeShape" class="icon-btn" type="button" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
  </div>
  <div id="shapeTabs" class="tabs" role="tablist" aria-label="Part of the tree"></div>
  <div id="shapeSliders"></div>
  <div class="pop-foot">
    <label class="toggle"><span class="switch"><input id="leaves" type="checkbox" role="switch" checked><i></i></span>Show leaves</label>
    <span class="pop-actions"><button id="reset" type="button" class="btn ghost" title="Every slider back to this kind of tree's own shape">Reset all</button><button id="done" type="button" class="btn primary">Done</button></span>
  </div>
</div>

<!-- the corner buttons -->
<div id="corner" class="hud">
  <button id="walk" class="round" type="button" aria-label="Walk" title="Walk"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="13" cy="4.5" r="2" fill="currentColor"/><path d="M10 21l2-6 3 3v4M9 12l2-4h3l2 4 2 1M11 8l-2 5-3 1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="full" class="round" type="button" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <button id="recenter" class="round" type="button" aria-label="Recentre on the tree" title="Recentre on the tree"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
</div>

<!-- the sun compass: a small sky; the sun (or the moon) rides a 24-hour ring, noon at the top. Drag it round to change the hour -->
<div id="sundial" class="dial hud" role="slider" aria-label="Time of day" tabindex="0" aria-valuemin="0" aria-valuemax="24">
  <svg viewBox="-50 -50 100 100">
    <defs><clipPath id="ball"><circle r="31"/></clipPath></defs>
    <circle r="48" class="ring"/>
    <circle r="40" class="track"/>
    <g id="sunTicks"></g>
    <g clip-path="url(#ball)"><circle id="sky" r="31"/><path d="M-31 8 Q-18 0 -5 6 T22 4 T31 6 V31 H-31Z" class="hill"/></g>
    <rect x="-17" y="-8.5" width="34" height="15" rx="7.5" class="readout"/>
    <text id="timeOut" y="2.6" class="dial-text time"></text>
    <g id="sunMark"><circle r="8" class="sun"/></g>
  </svg>
</div>

<!-- the season wheel: four quarters round the year, spring at the left, summer at the top. Drag round it: the year moves smoothly.
     Tap the middle to play the year through (and again to pause) -->
<div id="seasonWheel" class="dial hud" role="slider" aria-label="Season. Press Space to play the year" tabindex="0" aria-valuemin="0" aria-valuemax="1">
  <svg viewBox="-50 -50 100 100">
    <circle r="48" class="ring"/>
    <g id="quarters"></g>
    <circle r="29" class="hub"/>
    <g id="playBtn" class="play"><circle r="8.5" cy="-11" class="play-bg"/><path id="playIcon" class="play-icon" d="M-2.6 -15.2 L3.9 -11 L-2.6 -6.8Z"/></g>
    <text id="seasonOut" y="6" class="dial-text season"></text>
    <text id="monthOut" y="15.5" class="dial-text month"></text>
    <g id="seasonMark"><circle r="7" class="mark"/></g>
  </svg>
</div>

<div id="walkbar" hidden>
  <button id="stopWalk" type="button">Stop walking</button>
  <span id="walkTip">WASD to move, drag to look, Shift to run</span>
</div>
<div id="pad" hidden aria-hidden="true"><div class="knob"></div></div>
<div id="tip">Drag to look around, scroll to zoom</div>
<script type="module" src="/src/demo.js"></script>
</body>
</html>
