<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16201f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ghibli Foliage</title>
<link rel="stylesheet" href="/src/demo.css">
<link rel="stylesheet" href="/src/boot.css">
</head>
<body>
<div id="boot" role="status" aria-live="polite">
  <div class="cloud a"></div><div class="cloud b"></div>
  <div class="boot-card">
    <h1>Ghibli Foliage</h1>
    <p class="boot-sub">A painted meadow through the seasons</p>
    <div class="boot-bar"><i></i></div>
    <div class="boot-step">Loading</div>
  </div>
</div>
<span id="stats" hidden></span>

<!-- the tree: which kind, another of the same kind, and its shape -->
<div id="tree" class="hud">
  <button id="prev" class="chip-btn" type="button" aria-label="Previous tree">&#x2039;</button>
  <button id="name" class="chip-name" type="button" aria-label="Choose a tree"></button>
  <button id="next" class="chip-btn" type="button" aria-label="Next tree">&#x203A;</button>
  <button id="dice" class="chip-btn" type="button" aria-label="Grow a new tree of this kind" title="New tree">
    <svg viewBox="0 0 24 24" width="18" height="18"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="9" r="1.5" fill="currentColor"/><circle cx="15" cy="15" r="1.5" fill="currentColor"/><circle cx="15" cy="9" r="1.5" fill="currentColor"/><circle cx="9" cy="15" r="1.5" fill="currentColor"/></svg></button>
  <button id="shapeBtn" class="chip-btn" type="button" aria-label="Shape" title="Shape" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 8h10M18 8h2M4 16h2M10 16h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="16" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
</div>
<select id="species" aria-label="Tree" tabindex="-1"></select>
<div id="shape" class="pop" hidden>
  <div class="pop-head"><label class="toggle">Show leaves <span class="switch"><input id="leaves" type="checkbox" checked><i></i></span></label>
    <button id="reset" type="button" class="link">Reset shape</button></div>
  <div id="shapeSliders"></div>
</div>

<!-- the corner buttons -->
<div id="corner" class="hud">
  <button id="walk" class="round" type="button" aria-label="Walk" title="Walk (G)">
    <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="13" cy="4.5" r="2" fill="currentColor"/><path d="M10 21l2-6 3 3v4M9 12l2-4h3l2 4 2 1M11 8l-2 5-3 1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="full" class="round" type="button" aria-label="Fullscreen" title="Fullscreen">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <button id="recenter" class="round" type="button" aria-label="Recentre on the tree" title="Recentre on the tree">
    <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
</div>

<!-- the sun compass: a small sky; the sun (or the moon) rides a 24-hour ring, noon at the top. Drag it round to change the hour -->
<div id="sundial" class="dial hud" role="slider" aria-label="Time of day" tabindex="0" aria-valuemin="0" aria-valuemax="24">
  <svg viewBox="-50 -50 100 100">
    <defs>
      <linearGradient id="skyG" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#7cc4e4"/><stop offset=".5" stop-color="#cfe9f2"/><stop offset=".5" stop-color="#25335a"/><stop offset="1" stop-color="#121a33"/></linearGradient>
      <clipPath id="ball"><circle r="34"/></clipPath>
    </defs>
    <circle r="46" class="ring"/>
    <g clip-path="url(#ball)"><rect id="sky" x="-34" y="-34" width="68" height="68" fill="url(#skyG)"/><path d="M-34 6 Q-20 -2 -6 4 T22 2 T34 4 V34 H-34Z" class="hill"/></g>
    <circle r="34" class="rim"/>
    <g id="sunMark"><circle r="7" class="sun"/></g>
    <text id="timeOut" y="24" class="dial-text"></text>
  </svg>
</div>

<!-- the season wheel: four quarters round the year, spring at the left, summer at the top. Drag round it: the year moves smoothly.
     Tap the middle to play the year through (and again to pause) -->
<div id="seasonWheel" class="dial hud" role="slider" aria-label="Season" tabindex="0" aria-valuemin="0" aria-valuemax="1">
  <svg viewBox="-50 -50 100 100">
    <g id="quarters"></g>
    <circle r="27" class="hub"/>
    <g id="seasonMark"><circle r="6.5" class="mark"/></g>
    <text id="playGlyph" y="-10" class="dial-text tiny play">&#x25B6;</text>
    <text id="seasonOut" y="2" class="dial-text small"></text>
    <text id="monthOut" y="11" class="dial-text tiny"></text>
  </svg>
</div>

<div id="walkbar" hidden>
  <button id="stopWalk" type="button">Stop walking</button>
  <span id="walkTip">W A S D to move · drag to look · Shift to run</span>
</div>
<div id="pad" hidden aria-hidden="true"><div class="knob"></div></div>
<div id="tip">Drag to look around · pinch or scroll to zoom</div>
<script type="module" src="/src/demo.js"></script>
</body>
</html>
