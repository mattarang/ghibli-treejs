<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I</title>
<style>
@font-face { font-family: "R"; src: url("https://cdn.jsdelivr.net/gh/githubnext/monaspace@main/fonts/Web%20Fonts/Variable%20Web%20Fonts/Monaspace%20Radon/Monaspace%20Radon%20Var.woff2") format("woff2"); font-weight: 200 800; font-stretch: 100% 125%; font-style: oblique 0deg 11deg; }
html, body { margin: 0; height: 100%; }
/* the wind has been blowing from the left all season: everything has gathered against the downwind edge, leaning the way it goes; only
   the tree's own name stands upright, rooted. The upwind side is left open */
body { background: #e7b7a8; color: #3a1f2a; font-family: "R", monospace; }
.page { box-sizing: border-box; min-height: 100%; padding: 8vh 5vw 7vh; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; text-align: right; }
.root { margin: 0; font-weight: 800; font-stretch: 100%; font-style: normal; font-size: clamp(36px, 6.6vw, 104px); line-height: 1; letter-spacing: -.03em; }
.gust { margin: 0; font-style: oblique 11deg; line-height: 1.22; }
.gust .k { color: #803551; font-weight: 300; }
.gust .v { font-weight: 700; }
.g1 { font-size: clamp(22px, 3.4vw, 54px); font-stretch: 125%; margin-top: .5em; }
.g2 { font-size: clamp(19px, 2.6vw, 40px); font-stretch: 118%; }
.g3 { font-size: clamp(17px, 2.1vw, 32px); font-stretch: 110%; }
.g4 { font-size: clamp(15px, 1.7vw, 26px); font-stretch: 104%; }
.g5 { font-size: clamp(15px, 1.4vw, 21px); font-stretch: 100%; margin-top: 1.6em; color: #803551; font-weight: 400; }
.g5 span + span { margin-left: 1.5em; }
.g6 { font-size: clamp(13px, 1.1vw, 16px); margin-top: .6em; font-weight: 300; }
.g6 span + span { margin-left: 1.5em; }
</style>
</head>
<body>
<div class="page">
  <p class="root">Camphor tree</p>
  <p class="gust g1"><span class="k">Summer</span> <span class="v">Mid July</span> <span class="v">10:30</span></p>
  <p class="gust g2"><span class="k">Height</span> <span class="v">12.5 m</span></p>
  <p class="gust g3"><span class="k">Trunk height</span> <span class="v">1.9 m</span> <span class="k">Main limbs</span> <span class="v">7</span></p>
  <p class="gust g4"><span class="k">Branch angle</span> <span class="v">40°</span></p>
  <p class="gust g5"><span>Show leaves</span><span>Reset</span><span>Done</span></p>
  <p class="gust g6"><span>Growing the tree</span><span>Ghibli Foliage</span></p>
</div>
</body>
</html>
