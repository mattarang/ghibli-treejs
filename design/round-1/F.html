<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F</title>
<style>
@font-face { font-family: "DM"; src: url("https://cdn.jsdelivr.net/gh/rektdeckard/departure-mono@main/public/assets/DepartureMono-Regular.woff2") format("woff2"); }
html, body { margin: 0; height: 100%; }
/* every tree comes back exactly from its number: a fixed grid of characters, one size, every value in its own column, the same place
   every time. Hierarchy is only position and the two inks */
body { background: #d7d2e8; color: #2d2550; font-family: "DM", monospace; }
.page { box-sizing: border-box; min-height: 100%; padding: 8vh 7vw; display: flex; align-items: flex-end; justify-content: flex-end; }
.grid { font-size: clamp(16.5px, 3.1vw, 44px); line-height: 1.5; white-space: pre; width: 24ch; }
.grid p { margin: 0; }
.k { color: #5d538d; }
.gap { height: 1.5em; }
</style>
</head>
<body>
<div class="page">
  <div class="grid">
<p>Camphor tree</p>
<p class="gap"></p>
<p><span class="k">Height</span>            12.5 m</p>
<p><span class="k">Trunk height</span>       1.9 m</p>
<p><span class="k">Main limbs</span>             7</p>
<p><span class="k">Branch angle</span>         40°</p>
<p class="gap"></p>
<p>Summer  <span class="k">Mid July</span>   10:30</p>
<p class="gap"></p>
<p>Show leaves  Reset  Done</p>
<p class="gap"></p>
<p class="k">Growing the tree</p>
<p class="k">          Ghibli Foliage</p>
  </div>
</div>
</body>
</html>
