<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B</title>
<style>
@font-face { font-family: "Ju"; src: url("https://cdn.jsdelivr.net/gh/psb1558/Junicode-font@master/webfiles/JunicodeVF-Roman.woff2") format("woff2"); font-weight: 300 700; font-stretch: 75% 125%; }
@font-face { font-family: "Ju"; src: url("https://cdn.jsdelivr.net/gh/psb1558/Junicode-font@master/webfiles/JunicodeVF-Italic.woff2") format("woff2"); font-weight: 300 700; font-stretch: 75% 125%; font-style: italic; }
html, body { margin: 0; height: 100%; }
body { background: #dde6d3; color: #3b2a1e; font-family: "Ju", serif; font-feature-settings: "onum" 1, "liga" 1; }
/* the words grow as a tree claims space: from a narrow trunk at the foot, each limb set further out and wider, reaching for the open
   page; values sit at the tips in the leaf colour */
.page { min-height: 100%; box-sizing: border-box; padding: 7vh 7vw 6vh; display: flex; flex-direction: column; justify-content: flex-end; }
.crown { margin: 0 0 auto; align-self: flex-end; text-align: right; color: #476e34; font-style: italic; font-weight: 300; font-stretch: 125%; font-size: clamp(22px, 3.2vw, 44px); line-height: 1.12; }
.crown span { display: block; }
.crown .t { font-feature-settings: "lnum" 1; }
.limb { margin: 0; font-size: clamp(17px, 2.1vw, 30px); line-height: 1.5; white-space: nowrap; }
.limb .k { font-stretch: 75%; font-weight: 600; }
.limb .v { color: #476e34; font-stretch: 125%; font-weight: 300; margin-left: .4em; font-feature-settings: "lnum" 1; }
.l4 { padding-left: 39%; } .l3 { padding-left: 27%; } .l2 { padding-left: 16%; } .l1 { padding-left: 7%; }
.trunk { margin: .25em 0 0; font-stretch: 75%; font-weight: 700; font-size: clamp(46px, 9.5vw, 150px); line-height: .86; letter-spacing: -.01em; }
.roots { margin: .9em 0 0; font-stretch: 75%; font-weight: 400; font-size: clamp(13px, 1.1vw, 16px); }
.roots span + span { margin-left: 1.8em; }
.roots .app { font-style: italic; color: #476e34; }
@media (max-width: 640px) { .l4 { padding-left: 24%; } .l3 { padding-left: 16%; } .l2 { padding-left: 9%; } .l1 { padding-left: 3%; } }
</style>
</head>
<body>
<div class="page">
  <p class="crown"><span>Summer</span><span>Mid July</span><span class="t">10:30</span></p>
  <p class="limb l4"><span class="k">Branch angle</span><span class="v">40°</span></p>
  <p class="limb l3"><span class="k">Main limbs</span><span class="v">7</span></p>
  <p class="limb l2"><span class="k">Height</span><span class="v">12.5 m</span></p>
  <p class="limb l1"><span class="k">Trunk height</span><span class="v">1.9 m</span></p>
  <p class="trunk">Camphor tree</p>
  <p class="roots"><span>Show leaves</span><span>Reset</span><span>Done</span><span class="app">Ghibli Foliage</span><span class="app">Growing the tree</span></p>
</div>
</body>
</html>
